name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Release check (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Use release npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify Windows TUI terminal surface
        run: npm run verify:tui-windows

      - name: Verify publishable tarballs
        run: npm pack --workspaces --dry-run

      - name: Verify packaged install
        run: npm run verify:packaged-install

      - name: Verify GitHub Release artifact
        run: npm run release:artifacts

      - name: Verify OS keyring integration
        run: npm run verify:os-keyring
