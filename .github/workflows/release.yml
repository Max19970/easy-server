name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish verified Windows release
    runs-on: windows-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Use release npm version
        run: npm install --global npm@11.16.0

      - name: Verify tag matches package version
        run: node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag must equal ' + expected);"

      - name: Install dependencies
        run: npm ci

      - name: Verify public-release prerequisites
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibility = gh repo view $env:GITHUB_REPOSITORY --json visibility --jq .visibility
          if ($visibility -ne "PUBLIC") {
            throw "The GitHub repository must be public before creating the public release"
          }

          $version = node -p "require('./package.json').version"
          $packages = @(
            "@easyai101/easyserver-plugin-sdk",
            "@easyai101/easyserver",
            "@easyai101/easyserver-plugin-vastai",
            "@easyai101/easyserver-plugin-intelion"
          )
          foreach ($package in $packages) {
            $published = npm view "$package@$version" version --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $published -ne $version) {
              throw "$package@$version must be published before the GitHub Release is created"
            }
          }

      - name: Run deterministic release gate
        run: npm run release:check

      - name: Verify OS keyring integration
        run: npm run verify:os-keyring

      - name: Publish GitHub Release with the verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $refs = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0 -or $refs.Count -eq 0) {
            throw "Remote release tag $tag is missing"
          }

          $peeled = $refs | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          $target = if ($peeled) { $peeled } else { $refs[0] }
          $remoteSha = ($target -split '\s+')[0]
          if ($remoteSha -ne $env:GITHUB_SHA) {
            throw "Remote release tag moved after this workflow started"
          }

          $version = node -p "require('./package.json').version"
          $zip = "dist/release/easyserver-$version-windows-x64.zip"
          $checksums = "dist/release/easyserver-$version-SHA256SUMS.txt"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes must exist at $notes before the release tag is created"
          }
          $renderedNotes = Join-Path $env:RUNNER_TEMP "$tag-release-notes.md"
          node scripts/render-release-notes.mjs $notes $renderedNotes $env:GITHUB_REPOSITORY $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Release notes could not be rendered for GitHub"
          }

          gh release create $tag $zip $checksums --verify-tag --title "EasyServer $tag" --notes-file $renderedNotes
